# Render Blueprint for the Buddyy API (Postgres is hosted separately on Supabase).
# Deploy: push to GitHub, then New → Blueprint in the Render dashboard.
# The frontend is deployed separately on Vercel (see vercel.json).
services:
  - type: web
    name: buddyy-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free # free tier spins down after 15 min idle; upgrade to "starter" for always-on
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: COOKIE_SECURE
        value: "true"
      # Supabase Postgres (free). Paste the pooler connection string (port 6543)
      # in the Render dashboard — kept out of git.
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true # Render generates a strong secret
      # Fill these in the dashboard (or add here) — they are left blank on purpose:
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://buddyy.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      # Spatius talking avatar (renders client-side; keys stay server-side).
      - key: SPATIUS_API_KEY
        sync: false
      - key: SPATIUS_APP_ID
        sync: false
      - key: SPATIUS_AVATAR_ID
        sync: false
      # Google Cloud Text-to-Speech — the voice fed to the Spatius avatar.
      # Cloud API key with "Cloud Text-to-Speech API" enabled (not the AI Studio key).
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

# No Render-managed database — Postgres (with pgvector) is hosted on Supabase
# (free tier). Set DATABASE_URL above to the Supabase connection string.
