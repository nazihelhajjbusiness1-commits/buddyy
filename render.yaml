# Render Blueprint for the Buddyy API (Postgres is hosted separately on Supabase).
# Deploy: push to GitHub, then New → Blueprint in the Render dashboard.
# The frontend is deployed separately on Vercel (see vercel.json).
services:
  - type: web
    name: buddyy-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free # free tier spins down after 15 min idle; upgrade to "starter" for always-on
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: COOKIE_SECURE
        value: "true"
      # Supabase Postgres (free). Paste the pooler connection string (port 6543)
      # in the Render dashboard — kept out of git.
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true # Render generates a strong secret
      # Fill these in the dashboard (or add here) — they are left blank on purpose:
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://buddyy.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      # File storage — Supabase Storage (S3-compatible). Render's free tier has no
      # persistent disk, so uploads MUST go to object storage or they vanish on
      # restart. Create a bucket + S3 access key in the Supabase dashboard
      # (Storage → S3 Connection / S3 Access Keys) and fill these in.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false # e.g. buddyy-uploads
      - key: S3_ENDPOINT
        sync: false # e.g. https://<ref>.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        sync: false # e.g. us-east-1 (shown next to the endpoint)
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Spatius talking avatar (renders client-side; keys stay server-side).
      - key: SPATIUS_API_KEY
        sync: false
      - key: SPATIUS_APP_ID
        sync: false
      - key: SPATIUS_AVATAR_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

# No Render-managed database — Postgres (with pgvector) is hosted on Supabase
# (free tier). Set DATABASE_URL above to the Supabase connection string.
